# Sample values.yaml for deploying a 10x Receiver with filebeat in optimize mode.
# Optimize mode filters events and losslessly compacts the survivors for 50-65%
# volume reduction.
#
# Make sure to add your 10x license, as well as setup your backend info
# in the filebeat.yml config
#
# For more info on deploying, see -
# https://doc.log10x.com/apps/receiver/deploy/#filebeat
#
tenx:
  apiKey: "<YOUR-10X-API-KEY-HERE>"

  optimize: true

  runtimeName: "my-filebeat-optimizer"

daemonset:
  filebeatConfig:
    filebeat.yml: |
      filebeat.config.inputs:
        enabled: true
        path: {{ .Values.tenx.inputs.optimize }}

      filebeat.inputs:
      - type: filestream
        id: tenx_internal
        paths:
          - ${TENX_LOG_PATH}/*.log
        fields:
          log_type: tenx_internal
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
        - script:
            lang: javascript
            file: {{ .Values.tenx.processors.optimize }}

      output.elasticsearch:
        host: '${NODE_NAME}'
        hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'
        username: '${ELASTICSEARCH_USERNAME}'
        password: '${ELASTICSEARCH_PASSWORD}'
        protocol: https
        ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
        indices:
        - index: "tenx_internal"
          when.equals:
            fields.log_type: "tenx_internal"
        - index: "l1es_dml"
          when.has_fields: ["template", "templateHash"]
