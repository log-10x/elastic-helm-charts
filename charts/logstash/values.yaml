---
replicas: 1

# Allows you to add any config files in /usr/share/logstash/config/
# such as logstash.yml and log4j2.properties
#
# Note that when overriding logstash.yml, `http.host: 0.0.0.0` should always be included
# to make default probes work.
#
# With tenx.enabled and tenx.pipeline.managed both on, the chart adds a
# `pipelines.yml` here unless you supply one. A key you set always wins.
logstashConfig: {}
#  logstash.yml: |
#    key:
#      nestedkey: value
#  log4j2.properties: |
#    key = value

# Allows you to add any pipeline files in /usr/share/logstash/pipeline/
### ***warn*** there is a hardcoded logstash.conf in the image, override it first
#
# With tenx.enabled and tenx.pipeline.managed both on, the chart adds
# `tenx-ingest.conf` and `tenx-destinations.conf` here unless you supply keys of
# those names, and points pipelines.yml at them. The image's own logstash.conf
# stops being referenced at that point, which is also what frees port 5044.
logstashPipeline: {}
#  logstash.conf: |
#    input {
#      exec {
#        command => "uptime"
#        interval => 30
#      }
#    }
#    output { stdout { } }

# Allows you to add any pattern files in your custom pattern dir
logstashPatternDir: "/usr/share/logstash/patterns/"
logstashPattern: {}
#    pattern.conf: |
#      DPKG_VERSION [-+~<>\.0-9a-zA-Z]+

# Extra environment variables to append to this nodeGroup
# This will be appended to the current 'env:' key. You can use any of the kubernetes env
# syntax here
extraEnvs: []
#  - name: MY_ENVIRONMENT_VAR
#    value: the_value_goes_here

# Allows you to load environment variables from kubernetes secret or config map
envFrom: []
# - secretRef:
#     name: env-secret
# - configMapRef:
#     name: config-map

# Add sensitive data to k8s secrets
secrets: []
#  - name: "env"
#    value:
#      ELASTICSEARCH_PASSWORD: "LS1CRUdJTiBgUFJJVkFURSB"
#      api_key: ui2CsdUadTiBasRJRkl9tvNnw
#  - name: "tls"
#    value:
#      ca.crt: |
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#        LS0tLS1CRUdJT0K
#      cert.crt: "LS0tLS1CRUdJTiBlRJRklDQVRFLS0tLS0K"
#      cert.key.filepath: "secrets.crt" # The path to file should be relative to the `values.yaml` file.

# A list of secrets and their paths to mount inside the pod
secretMounts: []

hostAliases: []
# - ip: "127.0.0.1"
#   hostnames:
#   - "foo.local"
#   - "bar.local"

image: "docker.elastic.co/logstash/logstash"
imageTag: "8.5.1"
imagePullPolicy: "IfNotPresent"
imagePullSecrets: []

podAnnotations: {}

# additionals labels
labels: {}

logstashJavaOpts: "-Xmx1g -Xms1g"

resources:
  requests:
    cpu: "100m"
    memory: "1536Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

rbac:
  create: false
  serviceAccountAnnotations: {}
  serviceAccountName: ""
  annotations:
    {}
    # annotation1: "value1"
    # annotation2: "value2"
    # annotation3: "value3"

podSecurityPolicy:
  create: false
  name: ""
  spec:
    privileged: false
    fsGroup:
      rule: RunAsAny
    runAsUser:
      rule: RunAsAny
    seLinux:
      rule: RunAsAny
    supplementalGroups:
      rule: RunAsAny
    volumes:
      - secret
      - configMap
      - persistentVolumeClaim

persistence:
  enabled: false
  annotations: {}

extraVolumes:
  []
  # - name: extras
  #   emptyDir: {}

extraVolumeMounts:
  []
  # - name: extras
  #   mountPath: /usr/share/extras
  #   readOnly: true

extraContainers:
  []
  # - name: do-something
  #   image: busybox
  #   command: ['do', 'something']

extraInitContainers:
  []
  # - name: do-something
  #   image: busybox
  #   command: ['do', 'something']

# This is the PriorityClass settings as defined in
# https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
priorityClassName: ""

# By default this will make sure two pods don't end up on the same node
# Changing this to a region would allow you to spread pods across regions
antiAffinityTopologyKey: "kubernetes.io/hostname"

# Hard means that by default pods will only be scheduled if there are enough nodes for them
# and that they will never end up on the same node. Setting this to soft will do this "best effort"
antiAffinity: "hard"

# This is the node affinity settings as defined in
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
nodeAffinity: {}

# This is inter-pod affinity settings as defined in
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
podAffinity: {}

# The default is to deploy all pods serially. By setting this to parallel all pods are started at
# the same time when bootstrapping the cluster
podManagementPolicy: "Parallel"

httpPort: 9600

# Custom ports to add to logstash
extraPorts:
  []
  # - name: beats
  #   containerPort: 5001

updateStrategy: RollingUpdate

# This is the max unavailable setting for the pod disruption budget
# The default value of 1 will make sure that kubernetes won't allow more than 1
# of your pods to be unavailable during maintenance
maxUnavailable: 1

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# How long to wait for logstash to stop gracefully
terminationGracePeriod: 120

# Probes
# Default probes are using `httpGet` which requires that `http.host: 0.0.0.0` is part of
# `logstash.yml`. If needed probes can be disabled or overridden using the following syntaxes:
#
# disable livenessProbe
# livenessProbe: null
#
# replace httpGet default readinessProbe by some exec probe
# readinessProbe:
#   httpGet: null
#   exec:
#     command:
#       - curl
#      - localhost:9600

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 3

## Use an alternate scheduler.
## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
schedulerName: ""

nodeSelector: {}
tolerations: []

nameOverride: ""
fullnameOverride: ""

lifecycle:
  {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo Hello from the postStart handler > /usr/share/message"]
  # postStart:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo Hello from the postStart handler > /usr/share/message"]

service:
  {}
  # annotations: {}
  # type: ClusterIP
  # loadBalancerIP: ""
  # ports:
  #   - name: beats
  #     port: 5044
  #     protocol: TCP
  #     targetPort: 5044
  #   - name: http
  #     port: 8080
  #     protocol: TCP
  #     targetPort: 8080

ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/tls-acme: "true"
  className: "nginx"
  pathtype: ImplementationSpecific
  hosts:
    - host: logstash-example.local
      paths:
        - path: /beats
          servicePort: 5044
        - path: /http
          servicePort: 8080
  tls: []
  #  - secretName: logstash-example-tls
  #    hosts:
  #      - logstash-example.local

# =============================================================================
# Log10x Integration
# =============================================================================
# Enable Log10x sidecar for log cost analytics and optimization
tenx:
  # Enable Log10x sidecar container
  enabled: false

  # Log10x container image settings
  image:
    repository: "log10x/pipeline-10x"
    # Defaults to the chart APP version, i.e. the engine release this chart is
    # built against, when empty. It used to default to the chart version, which
    # moves on its own cadence: a chart advertising appVersion 1.1.39 deployed
    # log10x/pipeline-10x:1.0.21 and nothing in the render said so.
    tag: ""
    pullPolicy: "IfNotPresent"

  # ===========================================================================
  # SOCKETS. Logstash and the sidecar share one network namespace.
  # ===========================================================================
  #
  # Two TCP sockets carry the round trip:
  #
  #   Logstash ingest ──tcp──► sidecar :inputPort ──► Receiver
  #                                                      │
  #   Logstash destinations ◄──tcp── sidecar ◄───────────┘
  #                   :outputPort
  #
  # inputPort is 5046, not the engine module's own 5044 default. The stock
  # logstash image ships pipeline/logstash.conf with a `beats` input on 5044,
  # and a `beats` input is the most common thing a user adds by hand. Sharing a
  # namespace, whichever binds second dies: measured on 1.1.39 the sidecar lost,
  # with "Address already in use" and exit 1.
  #
  # Both ports must differ from each other. The render fails if they do not.
  #
  # These are written into a ConfigMap that REPLACES the copy of
  # run/input/forwarder/logstash/config.yaml shipped in the image. That file,
  # not any argument or environment variable, is what the engine reads: the
  # launch macro expands it into CLI options itself, so passing the same option
  # again is "option 'logstashInputPort' (string) should be specified only
  # once" and exit 2, including via overrideKey/overrideValue.
  #
  # With tenx.config.git.enabled or tenx.config.volume.enabled the whole 10x
  # config tree comes from you, so the ports come from there too and these
  # values reach only the Logstash half of the pair. Keep the two in sync.
  #
  inputPort: 5046
  outputPort: 5045
  outputHost: "127.0.0.1"

  # Name of the field in each Logstash event holding the log line. `message` is
  # what the `beats`, `file`, `tcp` and `http` inputs produce. Set it to e.g.
  # `log` for sources that do not.
  #
  inputMessageField: "message"

  # On-wire format for the record written back to Logstash.
  #
  #   delimited  each top-level field of the record is emitted as its own
  #              field, preserving the original structure. Pairs with the
  #              `codec => json_lines` on the return input.
  #   json       the whole record is wrapped as one stringified field.
  #
  outputEncodeType: "delimited"

  # ===========================================================================
  # STARTUP ORDER
  # ===========================================================================
  #
  # The engine opens its write-back socket to outputPort while it is building
  # the pipeline, and Kubernetes starts both containers at the same instant.
  # Logstash takes most of a minute to boot and bind, so the sidecar reaches an
  # unbound port. On 1.1.39 and earlier that is exit 1 and CrashLoopBackOff.
  #
  # With this on, the sidecar polls the port first, then execs the engine. On
  # timeout it launches the engine regardless rather than pretending to be
  # healthy.
  #
  waitForLogstash:
    enabled: true
    timeoutSeconds: 300

  # ===========================================================================
  # PIPELINES
  # ===========================================================================
  #
  # The 10x round trip needs two Logstash pipelines: one that ships events to
  # the sidecar, and one that binds outputPort and receives them back. Nothing
  # about it is optional, and the chart used to ship neither, so an install with
  # tenx.enabled and no hand-written pipeline could not work.
  #
  # With `managed` on the chart renders both, plus the pipelines.yml that points
  # at them. Substitute your own sources and destinations below, or set
  # `managed: false` and put complete files in logstashPipeline/logstashConfig.
  #
  pipeline:
    managed: true

    # The `input { }` body of the ingest pipeline. Replace with your real
    # sources. `beats` on 5044 matches what the stock image listens on, so
    # anything already shipping to this chart keeps working.
    ingestInput: |
      beats {
        id => "in_beats"
        port => 5044
      }

    # The `filter { }` body of the ingest pipeline. Runs once per event, on the
    # way in. The `tag` field is how the engine groups events by source: the
    # module reads it out of the JSON with `\"tag\":\"(.*?)\"`. Any value works.
    # Leave empty to render no filter block at all.
    ingestFilter: |
      mutate {
        id => "ingest_enrich"
        add_field => { "tag" => "logstash" }
      }

    # The `output { }` body of the destinations pipeline: where events go after
    # the round trip. Replace `stdout` with elasticsearch, opensearch,
    # splunk_hec, kafka, s3 and so on. The `tag` field survives the trip, so
    # destinations that route on it see the value they would without 10x.
    destinationOutput: |
      stdout {
        id => "out_stdout"
        codec => json_lines
      }

  # ===========================================================================
  # LICENCE. REQUIRED. Without one the 10x Receiver does not start at all.
  # ===========================================================================
  #
  # The licence is checked while the pipeline is being built, before any event
  # is read, and the Logstash read stream is one of the units that demands it.
  # With no licence the sidecar prints
  #
  #   readStream(stream:logstash) requires a license.
  #   Get yours at https://console.log10x.com
  #
  # and exits 1, WHILE LOGSTASH KEEPS RUNNING and keeps shipping raw.
  #
  # The image ships a fallback TENX_LICENSE_KEY of type "limited" (tenant
  # "public-image-limited"). It does not satisfy this gate. Treat the licence as
  # mandatory input to every install.
  #
  # Supply it in one of three ways:
  #
  #   1. licenseJwt      the token itself. The chart puts it in a Secret.
  #   2. licenseSecret   the name of a Secret you already manage.
  #   3. neither         only valid if you inject TENX_LICENSE_KEY or
  #                      TENX_LICENSE_FILE yourself through extraEnvs/envFrom.
  #                      The chart cannot see that, so it does not fail the
  #                      render, and you own the outcome.
  #
  # The signed JWT, downloaded from https://console.log10x.com
  #
  licenseJwt: ""

  # Name of an existing Secret holding the token. Takes precedence over
  # licenseJwt, so a GitOps repo never has to carry the token.
  #
  licenseSecret: ""

  # Key inside the Secret, whether chart-created or existing.
  #
  licenseSecretKey: "license-jwt"

  # How the token reaches the engine.
  #
  #   file  the Secret is projected to /etc/tenx/license/<licenseSecretKey> and
  #         TENX_LICENSE_FILE points at it. Preferred: the token never enters
  #         the process environment, and rotating the Secret rotates the file.
  #   env   the Secret is injected as TENX_LICENSE_KEY via secretKeyRef.
  #
  licenseDelivery: "file"

  # Deprecated. They used to set TENX_API_KEY, an environment variable NOTHING
  # reads: it appears neither in the image's config tree nor in the engine
  # binary. They were the licence under the wrong name, which is why no install
  # that set them ever started the engine.
  #
  # If either is set while licenseJwt and licenseSecret are both empty, the
  # chart treats the value as the licence JWT so an existing install starts
  # working instead of continuing to fail. Migrate to licenseJwt.
  #
  apiKey: ""
  license: ""

  # 10x Receiver mode. One of:
  #   - "receive"  : filter mode, drops events per local/centralized policy
  #   - "optimize" : filter and losslessly compact events for 50-65% volume reduction
  #   - "report"   : read-only observation, emits metrics without modifying the event stream
  kind: "receive"

  # Optional: name for this runtime instance
  runtimeName: ""

  # Resource limits for Log10x sidecar
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Git access token for fetching config/symbols from private Git repositories.
  # Works with any Git provider (GitHub, GitLab, Bitbucket, self-hosted).
  # When set, a Kubernetes Secret is created and injected via secretKeyRef.
  #
  gitToken: ""

  # Git config fetcher init container image
  # Used to clone config/symbols repositories when git integration is enabled
  #
  configFetcherImage:
    repository: "log10x/git-config-fetcher"
    tag: "1.0.0"
    pullPolicy: "IfNotPresent"

  # Control fetching 10x config and/or symbols from a git repository or a volume mount.
  # If either config or symbols git is enabled, the deployment will setup an init container
  # to fetch config/symbols before the logstash pod is live, and will share the result files
  # via a shared volume 'tenx-git' that's mounted at '/etc/tenx/git'
  #
  # To learn more about the git config fetcher, see:
  # https://github.com/log-10x/docker-images/tree/main/ext/git-config-fetcher
  #
  config:
    git:
      # If enabled, the init container will clone the config from a git repository.
      # The config will be at '/etc/tenx/git/config', and the TENX_CONFIG env var will
      # be set to point to it.
      #
      # Otherwise, the default config bundled with the 10x image will be used.
      #
      enabled: false

      # Full HTTPS URL of the git repository
      #
      url: ""

      # Optional - a branch to pull.
      # If omitted, the default repo branch will be used.
      # branch: "main"

    volume:
      # Mount an existing PersistentVolumeClaim for config (for air-gapped environments
      # or config managed outside of Git).
      #
      enabled: false
      claimName: ""

  symbols:
    git:
      # If enabled, the init container will clone the symbols from a git repository.
      # The symbols will be at '/etc/tenx/git/config/data/shared/symbols', and the
      # environment variable TENX_SYMBOLS_PATH will be set to match.
      #
      enabled: false

      # Full HTTPS URL of the git repository
      #
      url: ""

      # Optional - a branch to pull.
      # If omitted, the default repo branch will be used.
      # branch: "main"

      # Optional - a sub folder inside the repo where symbols were placed.
      # If omitted, the entire repo is considered as the symbols path.
      # path: "tenx/my-app/symbols"

    volume:
      # Mount an existing PersistentVolumeClaim for symbols (for air-gapped environments
      # or symbols managed outside of Git).
      #
      enabled: false
      claimName: ""
