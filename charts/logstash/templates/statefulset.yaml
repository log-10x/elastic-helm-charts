{{- if .Values.tenx.enabled }}{{- include "tenx.validatePorts" . }}{{- end }}
{{- $pipelineFiles := include "logstash.pipelineFiles" . | fromYaml -}}
{{- $configFiles := include "logstash.configFiles" . | fromYaml -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "logstash.fullname" . }}
  labels:
    app: "{{ template "logstash.fullname" . }}"
    chart: "{{ .Chart.Name }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  serviceName: {{ template "logstash.fullname" . }}-headless
  selector:
    matchLabels:
      app: "{{ template "logstash.fullname" . }}"
      release: {{ .Release.Name | quote }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: {{ template "logstash.fullname" . }}
    {{- with .Values.persistence.annotations  }}
      annotations:
{{ toYaml . | indent 8 }}
    {{- end }}
    spec:
{{ toYaml .Values.volumeClaimTemplate | indent 6 }}
  {{- end }}
  template:
    metadata:
      name: "{{ template "logstash.fullname" . }}"
      labels:
        app: "{{ template "logstash.fullname" . }}"
        chart: "{{ .Chart.Name }}"
        heritage: {{ .Release.Service | quote }}
        release: {{ .Release.Name | quote }}
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- /* This forces a restart if the configmap has changed */}}
        {{- if $configFiles }}
        configchecksum: {{ include (print .Template.BasePath "/configmap-config.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
        {{- /* This forces a restart if the configmap has changed */}}
        {{- if $pipelineFiles }}
        pipelinechecksum: {{ include (print .Template.BasePath "/configmap-pipeline.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
        {{- if .Values.logstashPattern }}
        patternchecksum: {{ include (print .Template.BasePath "/configmap-pattern.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
        {{- /* A port change has to roll the pod, or the two halves disagree */}}
        {{- if .Values.tenx.enabled }}
        tenxsocketchecksum: {{ include "tenx.socketEnv" . | sha256sum | trunc 63 }}
        {{- end }}
        {{- if .Values.secrets }}
        secretschecksum: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
    spec:
      {{- if .Values.schedulerName }}
      schedulerName: "{{ .Values.schedulerName }}"
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- if or .Values.rbac.create .Values.rbac.serviceAccountName }}
      serviceAccountName: "{{ template "logstash.serviceAccount" . }}"
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if or (eq .Values.antiAffinity "hard") (eq .Values.antiAffinity "soft") .Values.nodeAffinity .Values.podAffinity }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      affinity:
      {{- end }}
      {{- if eq .Values.antiAffinity "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - "{{ template "logstash.fullname" .}}"
            topologyKey: {{ .Values.antiAffinityTopologyKey }}
      {{- else if eq .Values.antiAffinity "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: {{ .Values.antiAffinityTopologyKey }}
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - "{{ template "logstash.fullname" . }}"
      {{- end }}
      {{- with .Values.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
      {{- with .Values.podAffinity }}
        podAffinity:
{{ toYaml . | indent 10 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriod }}
      volumes:
        {{- range .Values.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- if $configFiles }}
        - name: logstashconfig
          configMap:
            name: {{ template "logstash.fullname" . }}-config
        {{- end }}
        {{- if $pipelineFiles }}
        - name: logstashpipeline
          configMap:
            name: {{ template "logstash.fullname" . }}-pipeline
        {{- end }}
        {{- if .Values.logstashPattern }}
        - name: logstashpattern
          configMap:
            name: {{ template "logstash.fullname" . }}-pattern
        {{- end }}
      {{- if .Values.extraVolumes }}
      {{- if eq "string" (printf "%T" .Values.extraVolumes) }}
{{ tpl .Values.extraVolumes . | indent 8 }}
      {{- else }}
{{ toYaml .Values.extraVolumes | indent 8 }}
      {{- end }}
      {{- end }}
        {{- if .Values.tenx.enabled }}
        - name: tenx-sockets
          emptyDir: {}
        {{- if and (eq (include "tenx.licenseConfigured" .) "true") (eq (include "tenx.licenseDelivery" .) "file") }}
        - name: tenx-license
          secret:
            secretName: {{ include "tenx.licenseSecretName" . }}
            # Read-only to every uid in the pod rather than 0400, which would
            # hide the token from a non-root securityContext with no fsGroup.
            defaultMode: 0444
            items:
              - key: {{ .Values.tenx.licenseSecretKey | default "license-jwt" }}
                path: {{ .Values.tenx.licenseSecretKey | default "license-jwt" }}
        {{- end }}
        {{- if eq (include "tenx.healthcheckEnabled" .) "true" }}
        - name: tenx-probes
          configMap:
            name: {{ template "logstash.fullname" . }}-tenx-probes
            defaultMode: 0555
        {{- end }}
        {{- if or .Values.tenx.config.git.enabled .Values.tenx.symbols.git.enabled }}
        - name: tenx-git
          emptyDir: {}
        {{- end }}
        {{- if .Values.tenx.config.volume.enabled }}
        - name: tenx-config-volume
          persistentVolumeClaim:
            claimName: {{ .Values.tenx.config.volume.claimName }}
        {{- end }}
        {{- if .Values.tenx.symbols.volume.enabled }}
        - name: tenx-symbols-volume
          persistentVolumeClaim:
            claimName: {{ .Values.tenx.symbols.volume.claimName }}
        {{- end }}
        {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end}}
      {{- if .Values.hostAliases }}
      hostAliases: {{ toYaml .Values.hostAliases | nindent 6 }}
      {{- end }}
      {{- if or .Values.extraInitContainers (and .Values.tenx.enabled (or .Values.tenx.config.git.enabled .Values.tenx.symbols.git.enabled)) }}
      initContainers:
      {{- if .Values.extraInitContainers }}
      {{- if eq "string" (printf "%T" .Values.extraInitContainers) }}
{{ tpl .Values.extraInitContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraInitContainers | indent 6 }}
      {{- end }}
      {{- end }}
      {{- if and .Values.tenx.enabled (or .Values.tenx.config.git.enabled .Values.tenx.symbols.git.enabled) }}
      - name: tenx-git-config
        image: "{{ .Values.tenx.configFetcherImage.repository }}:{{ .Values.tenx.configFetcherImage.tag }}"
        imagePullPolicy: {{ .Values.tenx.configFetcherImage.pullPolicy }}
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-tenx-git-token
                key: token
        args:
          {{- if .Values.tenx.config.git.enabled }}
          - "--config-repo"
          - {{ .Values.tenx.config.git.url | quote }}
          {{- if .Values.tenx.config.git.branch }}
          - "--config-branch"
          - {{ .Values.tenx.config.git.branch | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.tenx.symbols.git.enabled }}
          - "--symbols-repo"
          - {{ .Values.tenx.symbols.git.url | quote }}
          {{- if .Values.tenx.symbols.git.branch }}
          - "--symbols-branch"
          - {{ .Values.tenx.symbols.git.branch | quote }}
          {{- end }}
          {{- if .Values.tenx.symbols.git.path }}
          - "--symbols-path"
          - {{ .Values.tenx.symbols.git.path | quote }}
          {{- end }}
          {{- end }}
        volumeMounts:
          - name: tenx-git
            mountPath: /data
      {{- end }}
      {{- end }}
      containers:
      - name: "{{ template "logstash.name" . }}"
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        image: "{{ .Values.image }}:{{ .Values.imageTag }}"
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        livenessProbe:
{{ toYaml .Values.livenessProbe | indent 10 }}
        readinessProbe:
{{ toYaml .Values.readinessProbe | indent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.httpPort }}
      {{- if .Values.extraPorts }}
        {{- toYaml .Values.extraPorts | nindent 8 }}
      {{- end }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        env:
          - name: LS_JAVA_OPTS
            value: "{{ .Values.logstashJavaOpts }}"
{{- if .Values.extraEnvs }}
{{ toYaml .Values.extraEnvs | indent 10 }}
{{- end }}
{{- if .Values.envFrom }}
        envFrom:
{{ toYaml .Values.envFrom | indent 10 }}
{{- end }}
        volumeMounts:
          {{- if .Values.persistence.enabled }}
          - name: "{{ template "logstash.fullname" . }}"
            mountPath: /usr/share/logstash/data
          {{- end }}
          {{- range .Values.secretMounts }}
          - name: {{ .name }}
            mountPath: {{ .path }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}
          {{- range $path, $config := $configFiles }}
          - name: logstashconfig
            mountPath: /usr/share/logstash/config/{{ $path }}
            subPath: {{ $path }}
          {{- end -}}
          {{- range $path, $config := $pipelineFiles }}
          - name: logstashpipeline
            mountPath: /usr/share/logstash/pipeline/{{ $path }}
            subPath: {{ $path }}
          {{- end -}}
          {{- if .Values.logstashPattern }}
          {{- $logstashPatternDir := .Values.logstashPatternDir -}}
          {{- range $path, $config := .Values.logstashPattern }}
          - name: logstashpattern
            mountPath: {{ $logstashPatternDir }}{{ $path }}
            subPath: {{ $path }}
          {{- end -}}
          {{- end -}}
        {{- if .Values.extraVolumeMounts }}
        {{- if eq "string" (printf "%T" .Values.extraVolumeMounts) }}
{{ tpl .Values.extraVolumeMounts . | indent 10 }}
        {{- else }}
{{ toYaml .Values.extraVolumeMounts | indent 10 }}
        {{- end }}
        {{- end }}
{{- if .Values.lifecycle }}
        lifecycle:
{{ toYaml .Values.lifecycle | indent 10 }}
{{- end }}
      {{- if .Values.extraContainers }}
      {{- if eq "string" (printf "%T" .Values.extraContainers) }}
{{ tpl .Values.extraContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraContainers | indent 6 }}
      {{- end }}
      {{- end }}
      {{- if .Values.tenx.enabled }}
      - name: tenx
        image: "{{ .Values.tenx.image.repository }}:{{ include "tenx.imageTag" . }}"
        imagePullPolicy: {{ .Values.tenx.image.pullPolicy }}
        {{- if .Values.tenx.waitForLogstash.enabled }}
        # The engine opens its write-back socket to tenx.outputPort while the
        # pipeline is being built, and Kubernetes starts both containers at
        # once. Logstash needs the better part of a minute to boot and bind, so
        # without this wait the sidecar reaches an unbound port and, on 1.1.39
        # and earlier, exits 1 into CrashLoopBackOff.
        #
        # /bin/sh in the image is bash, so /dev/tcp does the probing and nothing
        # extra has to be installed. The last line reproduces the image's own
        # entrypoint, "exec $TENX_BIN \"${@}\"", so args below stay unchanged.
        # On timeout the engine is launched anyway: newer engines wait for the
        # peer themselves, and an engine that still cannot start says so louder
        # than this script can.
        command:
          - /bin/sh
          - -c
          - |
            host="{{ .Values.tenx.outputHost }}"
            port="{{ .Values.tenx.outputPort }}"
            deadline=$(( $(date +%s) + {{ .Values.tenx.waitForLogstash.timeoutSeconds }} ))
            until (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "10x: gave up after {{ .Values.tenx.waitForLogstash.timeoutSeconds }}s waiting for the Logstash tcp input on $host:$port, starting anyway" >&2
                break
              fi
              echo "10x: waiting for the Logstash tcp input on $host:$port"
              sleep 2
            done
            exec "$TENX_BIN" "${@}"
          - --
        {{- end }}
        # The socket settings travel as TENX_ environment variables, read below.
        # They cannot be launch arguments: the @run/input/forwarder/logstash
        # macro expands the shipped config into 'logstashInputPort <value>'
        # itself, so a second copy is "option 'logstashInputPort' (string)
        # should be specified only once", exit 2, and the documented
        # overrideKey/overrideValue pair fails the same way. receiverOptimize
        # and receiverReadOnly appear in no config the macros load, so those
        # stay arguments.
        args:
          - "run"
          - "@run/input/forwarder/logstash"
          - "@apps/receiver"
          {{- if eq .Values.tenx.kind "optimize" }}
          - "receiverOptimize"
          - "true"
          {{- end }}
          {{- if eq .Values.tenx.kind "report" }}
          - "receiverReadOnly"
          - "true"
          {{- end }}
        ports:
          - name: tenx-in
            containerPort: {{ .Values.tenx.inputPort }}
            protocol: TCP
        {{- if eq (include "tenx.healthcheckEnabled" .) "true" }}
        # The sidecar carried no probe of any kind, so the kubelet reported it
        # Ready the moment the container was created and never looked again.
        # Measured on 1.1.39: an install whose licence was the string
        # "not-a-jwt" showed the tenx container ready=true, restarts=0, and no
        # engine output at all. Chart CI cannot fail on an engine that is not
        # running.
        #
        # A dead engine needs no probe. It is pid 1, so it takes the container
        # with it and the kubelet restarts it. These three cover the two states
        # that are invisible instead:
        #
        #   startup    the engine has not been launched yet, because the wait
        #              loop is still polling for Logstash. Nothing is wrong, so
        #              this holds the liveness probe off entirely rather than
        #              restarting a container whose only problem is its peer.
        #   readiness  the engine is not listening on tenx.inputPort, so events
        #              handed to it go nowhere.
        #   liveness   the engine is in the process table and doing nothing:
        #              stopped, traced, or deadlocked. The container stays
        #              Running with zero restarts for as long as you watch it.
        startupProbe:
{{ include "tenx.probe" (dict "ctx" . "probe" (merge (dict "failureThreshold" (include "tenx.startupFailureThreshold" . | int)) .Values.tenx.healthcheck.startupProbe) "mode" "startup") | indent 10 }}
        readinessProbe:
{{ include "tenx.probe" (dict "ctx" . "probe" .Values.tenx.healthcheck.readinessProbe "mode" "readiness") | indent 10 }}
        livenessProbe:
{{ include "tenx.probe" (dict "ctx" . "probe" .Values.tenx.healthcheck.livenessProbe "mode" "liveness") | indent 10 }}
        {{- end }}
        env:
{{ include "tenx.socketEnv" . | indent 10 }}
          # The engine reads exactly one credential, the licence JWT, from
          # TENX_LICENSE_FILE or TENX_LICENSE_KEY. Without it the Receiver
          # pipeline fails to build and the sidecar exits 1 on
          # "readStream(stream:logstash) requires a license" while Logstash
          # carries on shipping raw. The chart used to set only TENX_API_KEY,
          # which nothing reads.
          {{- if eq (include "tenx.licenseConfigured" .) "true" }}
          {{- if eq (include "tenx.licenseDelivery" .) "file" }}
          - name: TENX_LICENSE_FILE
            value: {{ include "tenx.licenseFilePath" . | quote }}
          {{- else }}
          - name: TENX_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "tenx.licenseSecretName" . }}
                key: {{ .Values.tenx.licenseSecretKey | default "license-jwt" }}
          {{- end }}
          {{- end }}
          {{- if eq (include "tenx.healthcheckEnabled" .) "true" }}
          # Read by the probe script only. The engine takes its socket settings
          # from the tenx-config ConfigMap, so this is the probe's copy of the
          # port and it is rendered from the same value.
          - name: TENX_PROBE_INPUT_PORT
            value: {{ .Values.tenx.inputPort | quote }}
          - name: TENX_PROBE_STALL_SECONDS
            value: {{ .Values.tenx.healthcheck.stallSeconds | quote }}
          {{- end }}
          {{- if .Values.tenx.runtimeName }}
          - name: TENX_RUNTIME_NAME
            value: {{ .Values.tenx.runtimeName | quote }}
          {{- end }}
          {{- if .Values.tenx.config.git.enabled }}
          - name: TENX_CONFIG
            value: "/etc/tenx/git/config"
          {{- else if .Values.tenx.config.volume.enabled }}
          - name: TENX_CONFIG
            value: "/etc/tenx/config"
          {{- end }}
          {{- if .Values.tenx.symbols.git.enabled }}
          - name: TENX_SYMBOLS_PATH
            value: "/etc/tenx/git/config/data/shared/symbols"
          {{- else if .Values.tenx.symbols.volume.enabled }}
          - name: TENX_SYMBOLS_PATH
            value: "/etc/tenx/symbols"
          {{- end }}
        resources:
{{ toYaml .Values.tenx.resources | indent 10 }}
        volumeMounts:
          - name: tenx-sockets
            mountPath: /tmp
          {{- if eq (include "tenx.healthcheckEnabled" .) "true" }}
          - name: tenx-probes
            mountPath: /etc/tenx/probes
            readOnly: true
          {{- end }}
          {{- if and (eq (include "tenx.licenseConfigured" .) "true") (eq (include "tenx.licenseDelivery" .) "file") }}
          - name: tenx-license
            mountPath: /etc/tenx/license
            readOnly: true
          {{- end }}
          {{- if or .Values.tenx.config.git.enabled .Values.tenx.symbols.git.enabled }}
          - name: tenx-git
            mountPath: /etc/tenx/git
          {{- end }}
          {{- if .Values.tenx.config.volume.enabled }}
          - name: tenx-config-volume
            mountPath: /etc/tenx/config
          {{- end }}
          {{- if .Values.tenx.symbols.volume.enabled }}
          - name: tenx-symbols-volume
            mountPath: /etc/tenx/symbols
          {{- end }}
      {{- end }}
