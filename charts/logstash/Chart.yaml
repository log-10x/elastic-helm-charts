apiVersion: v2
name: logstash
description: A Helm chart for Kubernetes for Logstash + 10x Observability engine
keywords:
  - 10x
  - log10x
  - logging
  - elastic
  - logstash
version: 1.0.21
appVersion: 8.5.1
icon: https://raw.githubusercontent.com/log-10x/elastic-helm-charts/main/icon.png
home: https://github.com/log-10x/elastic-helm-charts
sources:
  - https://github.com/log-10x/elastic-helm-charts
  - https://github.com/log-10x/docker-images
  - https://github.com/elastic/logstash
maintainers:
  - name: Log10x
    email: engineering@log10x.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Replaced tenx.kind with tenx.optimize and tenx.readOnly boolean flags, aligning with the fluent-bit chart. Defaults are both false (filter mode)."
    - kind: added
      description: "Pre-render validation rejects setting both tenx.optimize and tenx.readOnly to true."
