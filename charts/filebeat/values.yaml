---
# 10x configuration
#
# NOTE - also look at filebeatConfig which is placed lower in this file,
# as you may want to edit it for finer output control to elastic search.
#
tenx:
  # Main switch to enabled/disable 10x.
  #
  enabled: true

  # Image tag SUFFIX. Combined with the chart appVersion it selects the
  # published forwarder image: log10x/filebeat-10x:<appVersion>-<variant>.
  # For more details, see - https://doc.log10x.com/engine/flavors
  #
  # Must be jit or native. Any other value, or null, fails the render rather
  # than producing an image tag that cannot be pulled.
  #
  # This is a published image name, not a flavor flag, which is why it still
  # reads "native" after the compiler/runtime rename. See
  # https://github.com/log-10x/pipeline-releases/blob/main/FLAVORS.md
  #
  # native  the GraalVM runtime build. The only variant still built.
  # jit     RETIRED. It came from the jpackage 'edge' flavor, which is gone.
  #         Existing -jit tags keep working; no new ones are published.
  variant: native

  # Turns on Filebeat debug log
  #
  debug: false

  # ===========================================================================
  # LICENCE. REQUIRED. Without one the 10x Receiver does not start at all.
  # ===========================================================================
  #
  # The licence is not an "encode only" or "premium feature" gate. It is checked
  # while the pipeline is being built, before any event is read, and two units
  # of the default receiver pipeline demand it:
  #
  #   metricOutput(Log10xMetricRegistryFactory)   the metric surface
  #   logOutput(run/modules/output/event/unix)    the WRITE-BACK path, i.e. the
  #                                               socket that returns events to
  #                                               Filebeat
  #
  # So an unlicensed engine cannot even hand events back. With no licence the
  # engine prints
  #
  #   metricOutput(Log10xMetricRegistryFactory) requires a license.
  #   Optional: without one the engine runs on its built-in 30-day evaluation licence. Production: https://doc.log10x.com/manage/license/
  #
  # and exits 1. The container goes with it in about three seconds: the image's
  # docker-entrypoint runs
  #
  #   set -euo pipefail
  #   exec filebeat "$@" 2>&1 | $TENX_BIN run ...
  #
  # so the engine's exit status fails the pipeline and PID 1 leaves. An
  # unlicensed pod therefore crash-loops loudly, which is the one failure mode
  # nobody needs a probe for. It does not sit Ready with a dead engine.
  #
  # The image ships a fallback TENX_LICENSE_KEY of type "limited" (tenant
  # "public-image-limited"). It does NOT satisfy this gate: a container started
  # with nothing but the baked-in key exits 1 on the message above. Treat the
  # licence as mandatory input to every install.
  #
  # Supply it in ONE of three ways:
  #
  #   1. licenseJwt      the token itself. The chart puts it in a Secret.
  #   2. licenseSecret   the name of a Secret you already manage.
  #   3. neither         only valid if you inject TENX_LICENSE_KEY or
  #                      TENX_LICENSE_FILE yourself through extraEnvs/envFrom.
  #                      The chart cannot see that, so it does not fail the
  #                      render, and you own the outcome.
  #
  # The signed JWT; see https://doc.log10x.com/manage/license/
  # Leave empty and set licenseSecret if the token is managed elsewhere.
  #
  licenseJwt: ""

  # Name of an existing Secret holding the token. Takes precedence over
  # licenseJwt, so a GitOps repo never has to carry the token.
  #
  licenseSecret: ""

  # Key inside the Secret, whether chart-created or existing.
  #
  licenseSecretKey: "license-jwt"

  # How the token reaches the engine.
  #
  #   file  the Secret is projected to /etc/tenx/license/<licenseSecretKey> and
  #         TENX_LICENSE_FILE points at it. Preferred, and the engine's own
  #         bootstrap config says so: the token never enters the process
  #         environment, and rotating the Secret rotates the file in place.
  #   env   the Secret is injected as TENX_LICENSE_KEY via secretKeyRef. Use
  #         only where projecting a volume is not an option.
  #
  # Both are read by pipelines/run/bootstrap/config.yaml, which resolves
  # licenseFile ahead of licenseKey when both are set.
  #
  licenseDelivery: "file"

  # Deprecated, and no longer wired to anything. They used to set TENX_API_KEY,
  # an environment variable NOTHING reads: it appears nowhere in the image's
  # config tree and nowhere in the engine binary (grep -c -a TENX_API_KEY on
  # tenx-edge-1.1.38-amd64-native returns 0, against 2 for TENX_LICENSE_KEY).
  # They were the licence under the wrong name, which is why they never worked.
  #
  # They are NOT a second credential. The product's "API key" is a console/MCP
  # credential for the SaaS side; the forwarder never presents one. The engine
  # accepts exactly one secret, the licence JWT.
  #
  # If either is set while licenseJwt and licenseSecret are both empty, the
  # chart treats the value as the licence JWT, so an existing install starts
  # working instead of continuing to fail. Migrate to licenseJwt.
  #
  apiKey: ""
  license: ""

  # ===========================================================================
  # HEALTH CHECK
  # ===========================================================================
  #
  # The container runs two processes joined by one pipe:
  #
  #   exec filebeat "$@" 2>&1 | tenx-edge run ...
  #
  # WHAT THIS IS FOR, AND WHAT IT IS NOT FOR
  #
  # An engine that EXITS is not the case to worry about. The entrypoint wraps
  # that pipe in 'set -euo pipefail', so the engine's exit status kills PID 1
  # and Kubernetes restarts the container in about three seconds. That happens
  # with or without these probes, and it is loud.
  #
  # An engine that FREEZES is the case, and it is silent. SIGSTOP, a traced
  # process, a deadlock: the pid stays in the table, nothing breaks the pipe,
  # the entrypoint never returns, and the container survives indefinitely with
  # Filebeat writing into a stopped reader. Measured on 1.1.39 with the old
  # Filebeat-only probes, a SIGSTOPped engine left the pod 1/1 Ready for 150
  # seconds while 5.2MB piled up in the pipe.
  #
  # With this enabled, livenessProbe and readinessProbe run a script that keeps
  # the Filebeat test and adds four engine tests: the process is present, it is
  # not stopped or a zombie, its stdin is still Filebeat's stdout, and its
  # cumulative CPU has advanced recently. Measured on 1.1.39, 'kill -STOP' on
  # the engine failed the very next probe with
  #
  #   FAIL: engine pid 12 is stopped (state 'T'): frozen, not running
  #
  # 22 seconds after the freeze, and the container was restarted 29 seconds
  # after it at failureThreshold 3 / periodSeconds 10.
  #
  # The CPU test is the one that costs nothing on an idle node. An idle node is
  # a healthy node, so nothing here keys off event flow: the engine accrues CPU
  # on its own timers whatever the traffic. Measured idle on 1.1.38, cumulative
  # CPU advanced 33 ticks in 151 seconds and the longest stretch with no advance
  # was 20 seconds.
  #
  healthcheck:
    # Turn off to fall back to the Filebeat-only probes in livenessProbe and
    # readinessProbe below. A dead engine still restarts the container through
    # the entrypoint; a frozen one becomes invisible to Kubernetes again.
    #
    enabled: true

    # How long the engine may burn no CPU before the probes call it frozen.
    # Three times the worst idle gap measured above. Raise it on heavily
    # oversubscribed nodes, where a starved engine can legitimately go quiet
    # for longer.
    #
    stallSeconds: 60

    # Which Filebeat test the readiness probe runs before it looks at the
    # engine. One of:
    #
    #   output  'filebeat test output'. Correct for elasticsearch, logstash and
    #           kafka. It cannot test output.file, which answers "file output
    #           doesn't support testing" and exits 1.
    #   http    curl against Filebeat's stats endpoint, the same test liveness
    #           runs. Use with output.file.
    #   none    skip the Filebeat half; check the engine only.
    #
    readinessFilebeatTest: "output"

  # 10x Receiver mode. One of:
  #   - "receive"  : filter mode, drops events per local/centralized policy
  #   - "optimize" : filter and losslessly compact events for 50-65% volume reduction
  #   - "report"   : read-only observation, emits metrics without modifying the event stream
  kind: "receive"

  # Specify name for the 10x runtime
  # If empty, will use default from 10x configuration
  runtimeName:

  # Git access token for fetching config/symbols from private Git repositories.
  # Works with any Git provider (GitHub, GitLab, Bitbucket, self-hosted).
  # When set, a Kubernetes Secret is created and injected via secretKeyRef.
  #
  gitToken: ""

  # Git config fetcher init container image
  # Used to clone config/symbols repositories when git integration is enabled
  #
  configFetcherImage:
    repository: "log10x/git-config-fetcher"
    tag: "1.0.0"
    pullPolicy: "IfNotPresent"

  # Control fetching 10x config and/or symbols from a git repository or a volume mount.
  # If either config or symbols git is enabled, the deployment will setup an init container
  # to fetch config/symbols before the filebeat pod is live, and will share the result files
  # via a shared volume 'tenx-git' that's mounted at '/etc/tenx/git'
  #
  # To learn more about the git config fetcher, see:
  # https://github.com/log-10x/docker-images/tree/main/ext/git-config-fetcher
  #
  config:
    git:
      # If enabled, the init container will clone the config from a git repository.
      # The config will be at '/etc/tenx/git/config', and the TENX_CONFIG env var will
      # be set to point to it.
      #
      # Otherwise, the default config bundled with the filebeat+10x image will be used.
      #
      enabled: false

      # Full HTTPS URL of the git repository
      #
      url: ""

      # Optional - a branch to pull.
      # If omitted, the default repo branch will be used.
      # branch: "main"

    volume:
      # Mount an existing PersistentVolumeClaim for config (for air-gapped environments
      # or config managed outside of Git).
      #
      enabled: false
      claimName: ""

  symbols:
    git:
      # If enabled, the init container will clone the symbols from a git repository.
      # The symbols will be at '/etc/tenx/git/config/data/shared/symbols', and the
      # environment variable TENX_SYMBOLS_PATH will be set to match.
      #
      enabled: false

      # Full HTTPS URL of the git repository
      #
      url: ""

      # Optional - a branch to pull.
      # If omitted, the default repo branch will be used.
      # branch: "main"

      # Optional - a sub folder inside the repo where symbols were placed.
      # If omitted, the entire repo is considered as the symbols path.
      # path: "tenx/my-app/symbols"

    volume:
      # Mount an existing PersistentVolumeClaim for symbols (for air-gapped environments
      # or symbols managed outside of Git).
      #
      enabled: false
      claimName: ""

  # Read-back Unix socket config for the 10x Receiver, one entry per mode that
  # loops events back. The template selects the entry matching tenx.kind.
  # Report mode does not loop back, so it has no entry.
  #
  # Both modes point at the SAME file, and that is deliberate rather than a
  # copy-paste: the engine reads the socket address out of
  # conf/tenxNix.yml itself (see the module's stream.yaml, which includes
  # "run/modules/input/forwarder/filebeat/conf/" + tenxNix.yml|tenxWin.yml to
  # populate rawOutputUnixSocketAddress). Pointing Filebeat at any other file
  # would let the two ends disagree on the socket path.
  #
  # The old per-mode receive/ and optimize/ folders no longer exist in the
  # image: log-10x/modules moved receive/tenxNix.yml to conf/tenxNix.yml and
  # deleted optimize/tenxNix.yml. Verify against the image you deploy with:
  #   docker run --rm --entrypoint sh log10x/filebeat-10x:<tag> -c \
  #     'ls $TENX_MODULES/pipelines/run/modules/input/forwarder/filebeat/conf'
  inputs:
    optimize: ${TENX_MODULES}/pipelines/run/modules/input/forwarder/filebeat/conf/tenxNix.yml
    receive: ${TENX_MODULES}/pipelines/run/modules/input/forwarder/filebeat/conf/tenxNix.yml

  # Filebeat script processors that pipe collected events into the 10x Receiver.
  # The template selects the entry matching tenx.kind.
  #
  # receive and optimize share tenx-receive.js. Optimize is not a different
  # script: it is receive plus the receiverOptimize env var the DaemonSet sets
  # for tenx.kind=optimize, which switches the ENGINE's output encoding. The
  # forwarder-side job (mark the event, write it to stdout, cancel the local
  # copy) is identical, which is why the image ships only tenx-receive.js and
  # tenx-report.js.
  processors:
    optimize: ${TENX_MODULES}/pipelines/run/modules/input/forwarder/filebeat/script/tenx-receive.js
    receive: ${TENX_MODULES}/pipelines/run/modules/input/forwarder/filebeat/script/tenx-receive.js
    report: ${TENX_MODULES}/pipelines/run/modules/input/forwarder/filebeat/script/tenx-report.js

daemonset:
  # Annotations to apply to the daemonset
  annotations: {}
  # additionals labels
  labels: {}
  affinity: {}
  # Include the daemonset
  enabled: true
  # Extra environment variables for Filebeat container.
  envFrom: []
  # - configMapRef:
  #     name: config-secret
  #
  # ⚠️ Filebeat Output Limitation
  #
  # The Log10x engine reads events from Filebeat via a stdout pipe
  # (filebeat ... 2>&1 | tenx-edge run ...). Any Filebeat output that writes
  # to stdout (e.g., output.console) will inject data into this pipe and
  # cause JSON parsing errors in the 10x engine.
  #
  # Supported outputs: output.elasticsearch, output.logstash, output.file, output.kafka,
  #                    and any other output that does NOT write to stdout.
  # Unsupported:       output.console (writes to stdout, conflicts with the 10x pipe).
  #
  # For local testing without Elasticsearch, use output.file instead of output.console:
  #   output.file:
  #     path: "/tmp/filebeat-output"
  #     filename: filebeat-events
  #     rotate_every_kb: 10000
  #
  extraEnvs:
    - name: "ELASTICSEARCH_USERNAME"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: username
    - name: "ELASTICSEARCH_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password
  # Allows you to add any config files in /usr/share/filebeat
  extraVolumes: []
  # - name: extras
  #   emptyDir: {}
  extraVolumeMounts: []
  # - name: extras
  #   mountPath: /usr/share/extras
  #   readOnly: true
  hostNetworking: false
  # Allows you to add any config files in /usr/share/filebeat
  # such as filebeat.yml for daemonset
  #
  # 10x - in addition to the default filebeat k8s config, this adds several
  # components that are part of the 10x pipeline deployment:
  #
  # 1. Monitor of the 10x internal log, and reporting it to elasticsearch
  # 2. Setting up the JS processor (all apps) and 10x read-back ('receiver'/'optimizer')
  #    for the integration between the 10x pipeline and filebeat
  # 3. Reporting 10x template objects to elasticsearch ('optimizer' only)
  #
  filebeatConfig:
    filebeat.yml: |

      {{- if and .Values.tenx.enabled (ne .Values.tenx.kind "report") }}
      filebeat.config.inputs:
        enabled: true
        path: {{ index .Values.tenx.inputs .Values.tenx.kind }}
      {{- end }}

      filebeat.inputs:
      {{- if .Values.tenx.enabled }}
      - type: filestream
        id: tenx_internal
        paths:
          - ${TENX_LOG_PATH}/*.log
        fields:
          log_type: tenx_internal
      {{- end }}
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
        {{- if .Values.tenx.enabled }}
        - script:
            lang: javascript
            file: {{ index .Values.tenx.processors .Values.tenx.kind }}
        {{- end }}

      output.elasticsearch:
        host: '${NODE_NAME}'
        hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'
        username: '${ELASTICSEARCH_USERNAME}'
        password: '${ELASTICSEARCH_PASSWORD}'
        protocol: https
        ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
        {{- if .Values.tenx.enabled }}
        indices:
        - index: "tenx_internal"
          when.equals:
            fields.log_type: "tenx_internal"
        {{- if eq .Values.tenx.kind "optimize" }}
        - index: "l1es_dml"
          when.has_fields: ["template", "templateHash"]
        {{- end }}
        {{- end }}

  # Only used when updateStrategy is set to "RollingUpdate"
  maxUnavailable: 1
  nodeSelector: {}
  # A list of secrets and their paths to mount inside the pod
  # This is useful for mounting certificates for security other sensitive values
  secretMounts:
    - name: elasticsearch-master-certs
      secretName: elasticsearch-master-certs
      path: /usr/share/filebeat/certs/
  #  - name: filebeat-certificates
  #    secretName: filebeat-certificates
  #    path: /usr/share/filebeat/certs
  # Various pod security context settings. Bear in mind that many of these have an impact on Filebeat functioning properly.
  #
  # - User that the container will execute as. Typically necessary to run as root (0) in order to properly collect host container logs.
  # - Whether to execute the Filebeat containers as privileged containers. Typically not necessarily unless running within environments such as OpenShift.
  securityContext:
    runAsUser: 0
    privileged: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  tolerations: []

deployment:
  # Annotations to apply to the deployment
  annotations: {}
  # additionals labels
  labels: {}
  affinity: {}
  # Include the deployment
  enabled: false
  # Extra environment variables for Filebeat container.
  envFrom: []
  # - configMapRef:
  #     name: config-secret
  extraEnvs:
    - name: "ELASTICSEARCH_USERNAME"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: username
    - name: "ELASTICSEARCH_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password
  # Allows you to add any config files in /usr/share/filebeat
  extraVolumes: []
  # - name: extras
  #   emptyDir: {}
  extraVolumeMounts: []
  # - name: extras
  #   mountPath: /usr/share/extras
  #   readOnly: true
  # such as filebeat.yml for deployment
  #
  # 10x - the same three components the DaemonSet config carries, because the
  # Deployment runs the same image and the same in-container engine:
  #
  # 1. Monitor of the 10x internal log, and reporting it to elasticsearch
  # 2. Setting up the JS processor (all apps) and 10x read-back ('receiver'/'optimizer')
  #    for the integration between the 10x pipeline and filebeat
  # 3. Reporting 10x template objects to elasticsearch ('optimizer' only)
  #
  # Before chart 1.5.0 this config had none of it, so a Deployment install with
  # tenx.enabled left at its default of true started the engine with nothing
  # routed to it and nothing read back from it.
  #
  filebeatConfig:
    filebeat.yml: |

      {{- if and .Values.tenx.enabled (ne .Values.tenx.kind "report") }}
      filebeat.config.inputs:
        enabled: true
        path: {{ index .Values.tenx.inputs .Values.tenx.kind }}
      {{- end }}

      filebeat.inputs:
      {{- if .Values.tenx.enabled }}
        - type: filestream
          id: tenx_internal
          paths:
            - ${TENX_LOG_PATH}/*.log
          fields:
            log_type: tenx_internal
      {{- end }}
        - type: log
          paths:
            - /usr/share/filebeat/logs/filebeat
          {{- if .Values.tenx.enabled }}
          processors:
          - script:
              lang: javascript
              file: {{ index .Values.tenx.processors .Values.tenx.kind }}
          {{- end }}

      output.elasticsearch:
        host: "${NODE_NAME}"
        hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'
        username: "${ELASTICSEARCH_USERNAME}"
        password: "${ELASTICSEARCH_PASSWORD}"
        protocol: https
        ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
        {{- if .Values.tenx.enabled }}
        indices:
        - index: "tenx_internal"
          when.equals:
            fields.log_type: "tenx_internal"
        {{- if eq .Values.tenx.kind "optimize" }}
        - index: "l1es_dml"
          when.has_fields: ["template", "templateHash"]
        {{- end }}
        {{- end }}
  nodeSelector: {}
  # A list of secrets and their paths to mount inside the pod
  # This is useful for mounting certificates for security other sensitive values
  secretMounts:
    - name: elasticsearch-master-certs
      secretName: elasticsearch-master-certs
      path: /usr/share/filebeat/certs/
  #  - name: filebeat-certificates
  #    secretName: filebeat-certificates
  #    path: /usr/share/filebeat/certs
  #
  # - User that the container will execute as.
  # Not necessary to run as root (0) as the Filebeat Deployment use cases do not need access to Kubernetes Node internals
  # - Typically not necessarily unless running within environments such as OpenShift.
  securityContext:
    runAsUser: 0
    privileged: false
  resources:
    requests:
      cpu: "100m"
      memory: "100Mi"
    limits:
      cpu: "1000m"
      memory: "200Mi"
  tolerations: []

# Replicas being used for the filebeat deployment
replicas: 1

extraContainers: ""
# - name: dummy-init
#   image: busybox
#   command: ['echo', 'hey']

extraInitContainers: []
# - name: dummy-init

# Root directory where Filebeat will write data to in order to persist registry data across pod restarts (file position and other metadata).
hostPathRoot: /var/lib

dnsConfig: {}
# options:
#   - name: ndots
#     value: "2"
hostAliases: []
# - ip: "127.0.0.1"
#  hostnames:
#  - "foo.local"
#  - "bar.local"

image: "log10x/filebeat-10x"
imagePullPolicy: "IfNotPresent"
imagePullSecrets: []

# Overrides the image tag whose default is {{ .Chart.AppVersion }}-{{ .Values.tenx.variant }}
#
imageTag: ""

# # Only applicable for Deployment or StatefulSet
# replicaCount: 1

# Probe timings. With tenx.healthcheck.enabled the exec command below is
# replaced by /etc/tenx/probes/tenx-health.sh, which runs this same Filebeat test
# and then checks the engine. Every other field here is carried through
# untouched, so this is still the one place to tune the timings.
#
# failureThreshold 3 at periodSeconds 10 means a frozen engine is restarted about
# 30 seconds after the probe first fails. A killed or SIGSTOPped engine fails the
# very first probe, so 30 seconds is the whole detection time. A deadlocked
# engine that stays schedulable is caught by the CPU rule instead, at
# tenx.healthcheck.stallSeconds plus that same 30 seconds.
#
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        #!/usr/bin/env bash -e
        curl --fail 127.0.0.1:5066
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        #!/usr/bin/env bash -e
        filebeat test output
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

# Whether this chart should self-manage its service account, role, and associated role binding.
managedServiceAccount: true

clusterRoleRules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "apps"
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

podAnnotations: {}
# iam.amazonaws.com/role: es-cluster

# Custom service account override that the pod will use
serviceAccount: ""

# Annotations to add to the ServiceAccount that is created if the serviceAccount value isn't set.
serviceAccountAnnotations: {}
# eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/k8s.clustername.namespace.serviceaccount

# How long to wait for Filebeat pods to stop gracefully
terminationGracePeriod: 30
# This is the PriorityClass settings as defined in
# https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
priorityClassName: ""

updateStrategy: RollingUpdate

# Override various naming aspects of this chart
# Only edit these if you know what you're doing
nameOverride: ""
fullnameOverride: ""
