# CI test values for the DaemonSet: no elasticsearch, no dependency outside the
# test cluster, and the 10x engine ON.
#
# The engine needs a licence, and the workflow supplies it. lint-test.yaml
# passes --set-file tenx.licenseJwt=<file written from the TENX_LICENSE_JWT
# repository secret> and the chart puts the token in its own Secret. Nothing has
# to exist in the test namespace before the install, which matters because
# 'ct install' creates and destroys that namespace itself.
#
# When the secret is not available, which is every pull request from a fork, the
# workflow prints a warning and re-runs the install with tenx.enabled=false. CI
# then still checks that Filebeat installs, and says out loud that the engine
# went untested.
#
# Until chart 1.5.0 this file pinned tenx.enabled=false unconditionally, so no
# chart CI run had ever started the engine. A change that broke the engine could
# not turn this job red.

tenx:
  enabled: true

  # 'filebeat test output' answers "file output doesn't support testing" and
  # exits 1, so the readiness probe runs the http test against Filebeat's stats
  # endpoint instead. output.file is what this file uses, see below.
  healthcheck:
    readinessFilebeatTest: http

daemonset:
  # Remove elasticsearch credential references
  extraEnvs: []
  # Remove elasticsearch certificate mounts
  secretMounts: []
  # Minimal filebeat config that outputs to file (no elasticsearch), carrying
  # the same 10x wiring the shipped default carries: the read-back input the
  # engine returns events on, and the script processor that hands events to it.
  # Without those two the engine would run with nothing routed through it, and a
  # green run would prove only that a process started.
  #
  # NOTE: output.console cannot be used when tenx is enabled - it conflicts
  # with the 10x stdout pipe. Use output.file instead.
  filebeatConfig:
    filebeat.yml: |

      {{- if and .Values.tenx.enabled (ne .Values.tenx.kind "report") }}
      filebeat.config.inputs:
        enabled: true
        path: {{ index .Values.tenx.inputs .Values.tenx.kind }}
      {{- end }}

      filebeat.inputs:
      {{- if .Values.tenx.enabled }}
      - type: filestream
        id: tenx_internal
        paths:
          - ${TENX_LOG_PATH}/*.log
        fields:
          log_type: tenx_internal
      {{- end }}
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
        {{- if .Values.tenx.enabled }}
        - script:
            lang: javascript
            file: {{ index .Values.tenx.processors .Values.tenx.kind }}
        {{- end }}

      output.file:
        path: "/tmp/filebeat-output"
        filename: filebeat-events
        rotate_every_kb: 10000

# Kept for the fork-PR fallback, where the workflow re-runs the install with
# tenx.enabled=false. Without 10x there is no engine-aware probe to select the
# http test, and the stock readiness probe runs 'filebeat test output', which
# exits 1 against output.file. With 10x on, tenx.healthcheck replaces this
# handler and keeps the timings below.
readinessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        #!/usr/bin/env bash -e
        curl --fail 127.0.0.1:5066
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
