apiVersion: v2
name: filebeat
description: A Helm chart for Kubernetes for Filebeat + 10x Observability engine
keywords:
  - 10x
  - log10x
  - logging
  - elastic
  - filebeat
version: 1.0.13
appVersion: 1.0.19
icon: https://raw.githubusercontent.com/log-10x/elastic-helm-charts/main/icon.png
home: https://github.com/log-10x/elastic-helm-charts
sources:
  - https://github.com/log-10x/elastic-helm-charts
  - https://github.com/log-10x/docker-images
  - https://github.com/elastic/beats
maintainers:
  - name: Log10x
    email: engineering@log10x.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "tenx.kind values are 'receive', 'optimize', 'report'. The default filter mode is 'receive'."
    - kind: changed
      description: "Chart values use tenx-receive.js and the receive/tenxNix.yml input into the Receiver modules tree."
    - kind: changed
      description: "Report mode launches the Receiver in read-only mode (@apps/receiver receiverReadOnly true)."
    - kind: changed
      description: "Sample values file is filebeat-receive.yaml for the default filter mode."
