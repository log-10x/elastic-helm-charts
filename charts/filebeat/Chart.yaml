apiVersion: v2
name: filebeat
description: A Helm chart for Kubernetes for Filebeat + 10x Observability engine
keywords:
  - 10x
  - log10x
  - logging
  - elastic
  - filebeat
version: 1.3.0
appVersion: 1.1.38
icon: https://raw.githubusercontent.com/log-10x/elastic-helm-charts/main/icon.png
home: https://github.com/log-10x/elastic-helm-charts
sources:
  - https://github.com/log-10x/elastic-helm-charts
  - https://github.com/log-10x/docker-images
  - https://github.com/elastic/beats
maintainers:
  - name: Log10x
    email: engineering@log10x.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "tenx.variant defaults to 'native'. The 'jit' variant is retired: it was built from the jpackage 'edge' flavor, which has been removed. Existing -jit tags remain pullable and 'jit' remains an accepted value for anyone pinned to one."
    - kind: changed
      description: "tenx.kind values are 'receive', 'optimize', 'report'. The default filter mode is 'receive'."
    - kind: fixed
      description: "TENX_RUN_ARGS launches '@run/input/forwarder/filebeat', the folder form the image itself defaults to. The previous '@run/input/forwarder/filebeat/receive/config.yaml' names a path the config tree no longer has, and the engine aborted at startup with 'error expanding launch macro'."
    - kind: fixed
      description: "tenx.inputs points at conf/tenxNix.yml, the readback snippet the image actually ships and the same file the engine reads the socket address from. The receive/ and optimize/ folders it named were removed from log-10x/modules."
    - kind: fixed
      description: "tenx.processors.optimize points at tenx-receive.js. tenx-optimize.js was deleted from log-10x/modules; optimize mode is receive plus the receiverOptimize env var, not a different script."
    - kind: changed
      description: "Report mode launches the Receiver in read-only mode (@apps/receiver receiverReadOnly true)."
    - kind: changed
      description: "Sample values file is filebeat-receive.yaml for the default filter mode."
